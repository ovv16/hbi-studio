<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Display test</title>
  <style>
    body { margin: 0; padding: 20px; font: 16px/1.5 system-ui, sans-serif; background: #F6F1E8; color: #241D14; }
    .box { margin: 12px 0; padding: 14px; border: 1px solid #82602F; }
    .sw { display: flex; gap: 8px; margin: 8px 0; }
    .sw i { flex: 1; height: 44px; display: block; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Display test</h1>
  <p>Take one screenshot of this whole page.</p>
  <div class="sw"><i style="background:#F6F1E8"></i><i style="background:#FFFFFF"></i><i style="background:#82602F"></i><i style="background:rgba(246,241,232,.94)"></i></div>
  <div class="box" id="box">Text in a box</div>
  <pre id="out">Running…</pre>
  <script>
    var q = function (s) { try { return matchMedia(s).matches; } catch (e) { return 'err'; } };
    var el = document.getElementById('box');
    document.getElementById('out').textContent = [
      'prefers-color-scheme: dark = ' + q('(prefers-color-scheme: dark)'),
      'prefers-color-scheme: light = ' + q('(prefers-color-scheme: light)'),
      'forced-colors = ' + q('(forced-colors: active)'),
      'body bg = ' + getComputedStyle(document.body).backgroundColor,
      'body color = ' + getComputedStyle(document.body).color,
      'viewport = ' + innerWidth + 'x' + innerHeight,
      'UA = ' + navigator.userAgent
    ].join('\n');
  </script>
</body>
</html>
