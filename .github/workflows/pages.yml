# Publishes the contents of light/ at the root of the Pages URL.
# Without this, Pages serves the repo root and Jekyll renders README.md
# as the home page, pushing the real site down to /site/.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement flips the Pages build source to Actions on first run
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The light variant is the production site and ships at the root. The
      # old /light/ path stays as a forwarding stub so existing links land.
      - name: Assemble the publish root
        run: |
          mkdir -p _publish
          cp -r light/. _publish/
          mkdir -p _publish/light
          cp light/redirect-stub.html _publish/light/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish

      - id: deployment
        uses: actions/deploy-pages@v4
